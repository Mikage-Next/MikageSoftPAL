[package]
name = "sena-mobile"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "C interface for app hosts (iOS): runs a SoftPAL game into a Metal view. Header: platform/ios/include/sena_mobile.h"

[lib]
name = "sena_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# No window system and no CPAL: the host gives a view and pulls the sound.
pal-vm = { path = "../pal-vm", default-features = false, features = ["gpu", "host-audio"] }
pal-asset.workspace = true
wgpu.workspace = true
pollster.workspace = true
log.workspace = true
anyhow.workspace = true
encoding_rs.workspace = true
raw-window-handle = "0.6"
rtrb = "=0.3.2"
ttf-parser = "0.25"

[dev-dependencies]

[[bin]]
name = "sena-mobile-run"
path = "src/bin/sena-mobile-run.rs"
required-features = ["runner"]

[features]
# The headless runner (PNG snapshots); not part of the app's library.
runner = ["dep:png"]

[dependencies.png]
version = "0.17"
optional = true
